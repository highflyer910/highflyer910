name: Update DEV stats

on:
  schedule:
    - cron: "17 3 * * *" # every day at 03:17 UTC
  workflow_dispatch: # adds the "Run workflow" button in the Actions tab

permissions:
  contents: write # lets the job push the regenerated SVGs

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Follower pill
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          DEVTO_USERNAME: highflyer910
        run: node scripts/update-followers.js

      - name: Badge card
        # The scraper depends on DEV's HTML. If it breaks, keep the old card and still commit the pill.
        continue-on-error: true
        env:
          DEVTO_USERNAME: highflyer910
        run: node scripts/update-badges.js

      - name: Commit if something changed
        run: |
          git add assets
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update DEV stats"
          git pull --rebase
          git push
